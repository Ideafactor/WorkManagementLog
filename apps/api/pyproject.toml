[project]
name = "company-web-api"
version = "0.1.0"
description = "Reusable FastAPI application foundation"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "argon2-cffi>=25,<26",
    "asyncpg>=0.30,<1",
    "fastapi[standard]>=0.116,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "basedpyright>=1.31,<2",
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
    "pytest-anyio>=0.0.0",
    "ruff>=0.12,<1",
]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.13"
include = ["app", "tests"]
exclude = ["**/__pycache__", "**/.venv"]
reportUnusedCallResult = "warning"
reportUnusedVariable = "error"
reportMissingParameterType = "error"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "ISC001", "D203", "D213", "CPY001", "TD002", "TD003", "FIX002"]

[tool.ruff.lint.per-file-ignores]
"app/bootstrap.py" = ["T201"]
"app/config.py" = ["T201"]
"tests/**/*.py" = ["S101", "S105", "S106", "ARG", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
