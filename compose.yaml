services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local-only-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.local
    environment:
      DATABASE_URL_POOLED: postgresql+asyncpg://app:local-only-password@db:5432/app
      DATABASE_URL_DIRECT: postgresql+asyncpg://app:local-only-password@db:5432/app
      APP_ENV: development
      APP_TIMEZONE: Asia/Seoul
      FORWARDED_ALLOW_IPS: 127.0.0.1
    depends_on:
      db:
        condition: service_healthy
    command: release-and-serve

volumes:
  postgres-data:

