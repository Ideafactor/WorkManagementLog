name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: template_test
          POSTGRES_USER: template
          POSTGRES_PASSWORD: template
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U template -d template_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: test
      APP_TIMEZONE: Asia/Seoul
      DATABASE_URL_POOLED: postgresql+asyncpg://template:template@127.0.0.1:55432/template_test
      DATABASE_URL_DIRECT: postgresql+asyncpg://template:template@127.0.0.1:55432/template_test
      SESSION_SECRET: ci-session-secret-that-is-at-least-32-characters
      CSRF_SECRET: ci-csrf-secret-that-is-distinct-and-at-least-32
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - run: uv run ruff check app tests
      - run: uv run ruff format --check app tests
      - run: uv run basedpyright
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  image:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: VCS_REF=${{ github.sha }}

